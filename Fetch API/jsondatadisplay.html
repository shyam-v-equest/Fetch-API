<!DOCTYPE html>
<html>
<head>
  <title>JSON Data Display</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<fieldset>
  <legend>Mention Page and Limit</legend>
  <label>Page:</label>
  <input type="number" id="page" value="1"><br>

  <label>Limit:</label>
  <input type="number" id="limit" value="5"><br>

  <button type="button" onclick="getData()">Submit</button>
</fieldset>

<table>
  <thead>
    <tr>
      <th>UserId</th>
      <th>Id</th>
      <th>Title</th>
      <th>Body</th>
    </tr>
  </thead>
  <tbody id="json-data"></tbody>
</table>

<div id="scroll-trigger"></div>

<script src="./script.js"></script>
</body>
</html>
